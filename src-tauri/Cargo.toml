[package]
name = "setup-hub"
version = "1.2.0"
description = "One-click post-reinstall provisioning for Windows 11"
edition = "2021"
default-run = "setup-hub"

[lib]
name = "setup_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "verify-catalog"
path = "src/bin/verify_catalog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Globalization", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
