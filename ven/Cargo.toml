[package]
name = "ven"
version = "1.0.0"
edition = "2021"
description = "Keeps Vencord installed and current, then starts Discord (installed by Setup Hub)"
publish = false

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
